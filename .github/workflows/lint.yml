name: Lint

on:
    pull_request:
    push:
        branches: [main, develop]

permissions: {}

jobs:
    oxlint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - run: npm install
            - run: npm run lint -- --format=github
