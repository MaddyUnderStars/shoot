name: Format

on:
    pull_request:
    push:
        branches: [main, develop]

permissions: {}

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - run: npm install --frozen-lockfile
            - run: npm run fmt -- --check
